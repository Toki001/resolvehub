openapi: 3.1.0
info:
  title: ResolveHub API
  version: 0.2.0
  description:
    Contract-first commands for authenticated organizations. Reads use schema-first GraphQL
    at /graphql. All errors and responses carry a correlation ID. Bodies reject undeclared fields.
    No client-supplied organization identity is trusted.
servers:
  - url: http://localhost:3001
security:
  - BearerAuth: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - service
                properties:
                  status:
                    type: string
                    const: alive
                  service:
                    type: string
                    const: api
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Dependencies and contract migration are ready
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: One or more dependencies are unavailable
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /v1/me:
    get:
      operationId: getIdentity
      description:
        Identity derived from a verified bearer credential joined to an active membership.
        Tenant headers are not authorization.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description:
            Optional UUID. Valid values are normalized to lowercase; invalid values are replaced
            with a fresh correlation ID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verified organization membership
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/tickets:
    post:
      operationId: createTicket
      description:
        Create a ticket and its initial customer message atomically. Requires admin or agent
        membership. No organization ID is accepted in the body.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description:
            Optional UUID. Valid values are normalized to lowercase; invalid values are replaced
            with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          description:
            Required for bearer-authenticated mutations. Tenant-scoped, retained at least 24 hours.
            Same method/path and normalized payload replay the original status/body; conflicting
            reuse returns 409. Replays get the current attempt’s X-Request-ID header; a job retains
            its original requestId.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
      responses:
        '201':
          description: Ticket created
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketInput'
  /v1/documents/ingestions:
    post:
      operationId: requestDocumentIngestion
      description: Accept a durable ingestion request for a staged object in the authenticated
        organization’s namespace. Parsing/indexing is asynchronous; acceptance is not index
        publication. Requires admin or agent.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description:
            Optional UUID. Valid values are normalized to lowercase; invalid values are replaced
            with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          description:
            Required for bearer-authenticated mutations. Tenant-scoped, retained at least 24 hours.
            Same method/path and normalized payload replay the original status/body; conflicting
            reuse returns 409. Replays get the current attempt’s X-Request-ID header; a job retains
            its original requestId.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
      responses:
        '202':
          description: Ingestion request durably accepted
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
            Location:
              description: Relative resource or job-status URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedJob'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/CapacityError'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionInput'
  /v1/documents/{id}/versions:
    post:
      operationId: requestDocumentVersion
      description: Accept a durable ingestion request for a staged object in the authenticated
        organization’s namespace. Parsing/indexing is asynchronous; acceptance is not index
        publication. Requires admin or agent. A replacement never removes the current active index before publication.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Request-ID
          required: false
          description:
            Optional UUID. Valid values are normalized to lowercase; invalid values are replaced
            with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          description:
            Required for bearer-authenticated mutations. Tenant-scoped, retained at least 24 hours.
            Same method/path and normalized payload replay the original status/body; conflicting
            reuse returns 409. Replays get the current attempt’s X-Request-ID header; a job retains
            its original requestId.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
      responses:
        '202':
          description: Ingestion request durably accepted
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
            Location:
              description: Relative resource or job-status URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedJob'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/CapacityError'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentVersionInput'
  /v1/tickets/{id}/drafts:
    post:
      operationId: requestDraft
      description:
        Accept a durable draft request for an accessible ticket. Generation is asynchronous and
        no reply is sent.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description:
            Optional UUID. Valid values are normalized to lowercase; invalid values are replaced
            with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          description:
            Required for bearer-authenticated mutations. Tenant-scoped, retained at least 24 hours.
            Same method/path and normalized payload replay the original status/body; conflicting
            reuse returns 409. Replays get the current attempt’s X-Request-ID header; a job retains
            its original requestId.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
      responses:
        '202':
          description: Draft request durably accepted
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
            Location:
              description: Relative resource or job-status URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedJob'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/jobs/{id}:
    get:
      operationId: getJob
      description:
        Return actual tenant-scoped durable job status. Unknown and inaccessible jobs both
        return 404.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description:
            Optional UUID. Valid values are normalized to lowercase; invalid values are replaced
            with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current job status
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/jobs/{id}/failure:
    get:
      operationId: getJobFailure
      description:
        Return actual tenant-scoped durable job status. Unknown and inaccessible jobs both
        return 404.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description:
            Optional UUID. Valid values are normalized to lowercase; invalid values are replaced
            with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current job status
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailedJob'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/jobs/{id}/replay:
    post:
      operationId: replayJob
      description:
        Admin-only replay of a failed request. Creates a new accepted request and an audit
        record; the failed request is preserved.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description:
            Optional UUID. Valid values are normalized to lowercase; invalid values are replaced
            with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          description:
            Required for bearer-authenticated mutations. Tenant-scoped, retained at least 24 hours.
            Same method/path and normalized payload replay the original status/body; conflicting
            reuse returns 409. Replays get the current attempt’s X-Request-ID header; a job retains
            its original requestId.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
      responses:
        '202':
          description: Replay durably accepted
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
            Location:
              description: Relative resource or job-status URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedJob'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/drafts/{id}/approve:
    post:
      operationId: approveDraft
      description:
        Human approval with optimistic revision control. Requires admin or agent and verified
        citations still belonging to active published knowledge. Approval and one internal ticket
        message commit atomically. Human-edited wording requires acknowledgeEdits=true. No
        external delivery is performed.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description:
            Optional UUID. Valid values are normalized to lowercase; invalid values are replaced
            with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          description:
            Required for bearer-authenticated mutations. Tenant-scoped, retained at least 24 hours.
            Same method/path and normalized payload replay the original status/body; conflicting
            reuse returns 409. Replays get the current attempt’s X-Request-ID header; a job retains
            its original requestId.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
      responses:
        '200':
          description: Audited draft approval
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveDraftInput'
  /v1/drafts/{id}/reject:
    post:
      operationId: rejectDraft
      description:
        Human rejection with optimistic revision control. Requires admin or agent. Only pending
        drafts can be reviewed.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description:
            Optional UUID. Valid values are normalized to lowercase; invalid values are replaced
            with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          description:
            Required for bearer-authenticated mutations. Tenant-scoped, retained at least 24 hours.
            Same method/path and normalized payload replay the original status/body; conflicting
            reuse returns 409. Replays get the current attempt’s X-Request-ID header; a job retains
            its original requestId.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
      responses:
        '200':
          description: Audited draft rejection
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectDraftInput'
  /v1/webhooks/tickets:
    post:
      operationId: receiveTicketWebhook
      description:
        Authenticate an active server-side integration using HMAC-SHA256 over timestamp + "." +
        exact raw request bytes. Reject timestamps outside ±300 seconds, invalid signatures and
        payloads above 64 KiB before mutation. eventId is mandatory; duplicates replay the receipt
        and altered reuse returns 409. The integration record determines the tenant; body/header
        tenant IDs convey no authority.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description:
            Optional UUID. Valid values are normalized to lowercase; invalid values are replaced
            with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Webhook-ID
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Webhook-Timestamp
          required: true
          schema:
            type: string
            pattern: ^[0-9]{10}$
        - in: header
          name: X-Webhook-Signature
          required: true
          schema:
            type: string
            pattern: ^v1=[a-f0-9]{64}$
      responses:
        '202':
          description: Webhook receipt durably accepted
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
            Location:
              description: Relative resource or job-status URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedJob'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTicketInput'
      security:
        - WebhookSignature: []
  /v1/drafts/{id}/edits:
    post:
      operationId: editDraft
      description: Edit only a pending draft with optimistic revision control. Human
        edits preserve the original text and source quotations; approval requires
        explicit acknowledgement of edits.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description: Optional UUID. Valid values are normalized to lowercase; invalid
            values are replaced with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          description: Required for bearer-authenticated mutations. Tenant-scoped,
            retained at least 24 hours. Same method/path and normalized payload
            replay the original status/body; conflicting reuse returns 409.
            Replays get the current attempt’s X-Request-ID header; a job retains
            its original requestId.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
      responses:
        '200':
          description: Mutation committed
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical
                lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditDraftInput'
  /v1/tickets/{id}/status:
    post:
      operationId: changeTicketStatus
      description: Apply a deterministic status event with expected current status.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description: Optional UUID. Valid values are normalized to lowercase; invalid
            values are replaced with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          description: Required for bearer-authenticated mutations. Tenant-scoped,
            retained at least 24 hours. Same method/path and normalized payload
            replay the original status/body; conflicting reuse returns 409.
            Replays get the current attempt’s X-Request-ID header; a job retains
            its original requestId.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
      responses:
        '200':
          description: Mutation committed
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical
                lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTicketStatusInput'
  /v1/tickets/{id}/messages:
    post:
      operationId: recordCustomerMessage
      description: Record incoming customer context inside an existing ticket. Agent
        replies can only be recorded through human draft approval.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description: Optional UUID. Valid values are normalized to lowercase; invalid
            values are replaced with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          description: Required for bearer-authenticated mutations. Tenant-scoped,
            retained at least 24 hours. Same method/path and normalized payload
            replay the original status/body; conflicting reuse returns 409.
            Replays get the current attempt’s X-Request-ID header; a job retains
            its original requestId.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
      responses:
        '201':
          description: Mutation committed
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical
                lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerMessageInput'
  /v1/documents/uploads:
    post:
      operationId: uploadDocument
      description: Stage up to 10 MiB in private storage under the authenticated
        organization. Content type is declared in X-Document-Type; the worker
        validates the actual bytes. This operation does not publish an index.
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          description: Optional UUID. Valid values are normalized to lowercase; invalid
            values are replaced with a fresh correlation ID.
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          description: Required for bearer-authenticated mutations. Tenant-scoped,
            retained at least 24 hours. Same method/path and normalized payload
            replay the original status/body; conflicting reuse returns 409.
            Replays get the current attempt’s X-Request-ID header; a job retains
            its original requestId.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
        - in: header
          name: X-Document-Type
          required: true
          schema:
            type: string
            enum:
              - text/plain
              - text/markdown
              - application/pdf
      responses:
        '201':
          description: Mutation committed
          headers:
            X-Request-ID:
              description: Correlation ID for this HTTP attempt; returned in canonical
                lowercase for a valid UUID.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedDocument'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description:
        Opaque expiring API credential; only its SHA-256 digest is stored. Active membership is
        resolved on every request.
    WebhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC-SHA256, used with X-Webhook-ID and X-Webhook-Timestamp.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          enum:
            - INVALID_INPUT
            - INVALID_CURSOR
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - INVALID_CONTENT
            - PAYLOAD_TOO_LARGE
            - CAPACITY_EXCEEDED
            - DEPENDENCY_UNAVAILABLE
            - INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
    Readiness:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        service:
          type: string
          enum:
            - api
            - worker
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - up
              - down
    Identity:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - membershipId
        - subject
        - role
      properties:
        organizationId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        subject:
          type: string
        role:
          type: string
          enum:
            - admin
            - agent
            - analyst
    CreateTicketInput:
      type: object
      additionalProperties: false
      required:
        - subject
        - customerEmail
        - message
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        customerEmail:
          type: string
          format: email
          maxLength: 254
        message:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: \S
    Ticket:
      type: object
      additionalProperties: false
      required:
        - id
        - subject
        - customerEmail
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 200
        customerEmail:
          type: string
          format: email
        status:
          type: string
          enum:
            - open
            - pending
            - resolved
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Message:
      type: object
      additionalProperties: false
      required:
        - id
        - body
        - author
        - createdAt
        - deliveryStatus
        - sourceDraftId
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        author:
          type: string
          enum:
            - customer
            - agent
        createdAt:
          type: string
          format: date-time
        deliveryStatus:
          type: string
          enum:
            - received
            - internal
        sourceDraftId:
          type:
            - string
            - 'null'
          format: uuid
    IngestionInput:
      type: object
      additionalProperties: false
      required:
        - title
        - objectKey
        - mediaType
        - sizeBytes
        - sha256
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        objectKey:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^organizations/[0-9a-f-]{36}/uploads/[0-9a-f-]{36}$
          description:
            Existing staged object key. The organization namespace must match the authenticated
            identity; filenames, URLs and traversal segments are not accepted.
        mediaType:
          type: string
          enum:
            - text/plain
            - text/markdown
            - application/pdf
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    DocumentVersionInput:
      type: object
      additionalProperties: false
      required:
        - objectKey
        - mediaType
        - sizeBytes
        - sha256
      properties:
        objectKey:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^organizations/[0-9a-f-]{36}/uploads/[0-9a-f-]{36}$
          description:
            Existing staged object key. The organization namespace must match the authenticated
            identity; filenames, URLs and traversal segments are not accepted.
        mediaType:
          type: string
          enum:
            - text/plain
            - text/markdown
            - application/pdf
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    AcceptedJob:
      type: object
      additionalProperties: false
      required:
        - jobId
        - status
        - statusUrl
        - requestId
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          const: accepted
        statusUrl:
          type: string
          pattern: ^/v1/jobs/[0-9a-f-]{36}$
        requestId:
          type: string
          format: uuid
    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - status
        - resourceId
        - attempts
        - reasonCode
        - requestId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - document_ingestion
            - draft_response
            - ticket_webhook
        status:
          type: string
          enum:
            - accepted
            - processing
            - succeeded
            - failed
            - cancelled
        resourceId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        attempts:
          type: integer
          minimum: 0
        reasonCode:
          anyOf:
            - type: string
            - type: 'null'
        requestId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description:
        Durable request state. Document ingestion is processed asynchronously with durable attempts and failures.
        Other job kinds remain accepted until their processors are implemented.
    FailedJob:
      type: object
      additionalProperties: false
      required:
        [
          jobId,
          errorCategory,
          summary,
          inputFingerprint,
          requestId,
          replayEligible,
          replayedAs,
          failedAt,
          attemptHistory,
        ]
      properties:
        jobId: { type: string, format: uuid }
        errorCategory: { type: string }
        summary: { type: string }
        inputFingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        requestId: { type: string, format: uuid }
        replayEligible: { type: boolean }
        replayedAs:
          anyOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        failedAt: { type: string, format: date-time }
        attemptHistory:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [attempt, stage, outcome, errorCategory, summary, startedAt, finishedAt]
            properties:
              attempt: { type: integer, minimum: 1, maximum: 4 }
              stage: { type: string }
              outcome: { type: string, enum: [running, succeeded, transient, permanent, abandoned] }
              errorCategory:
                anyOf:
                  - { type: string }
                  - { type: 'null' }
              summary:
                anyOf:
                  - { type: string }
                  - { type: 'null' }
              startedAt: { type: string, format: date-time }
              finishedAt:
                anyOf:
                  - { type: string, format: date-time }
                  - { type: 'null' }
    Citation:
      type: object
      additionalProperties: false
      required:
        - documentId
        - versionId
        - chunkId
      properties:
        documentId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        chunkId:
          type: string
          format: uuid
        quote:
          type: string
          minLength: 12
          maxLength: 1000
        reference:
          type: string
          pattern: '^\[[1-5]\]$'
    DraftGeneration:
      type: object
      additionalProperties: false
      required:
        [
          accountedAttempts,
          usageIncomplete,
          outcome,
          abstentionReason,
          provider,
          model,
          embeddingModel,
          promptVersion,
          inputTokens,
          outputTokens,
          embeddingTokens,
          tokenCountSource,
          estimatedCostUsd,
          pricing,
          retrievalLatencyMs,
          generationLatencyMs,
          totalLatencyMs,
          generatedAt,
          retrievalMode,
        ]
      properties:
        accountedAttempts:
          type: integer
          minimum: 0
        usageIncomplete:
          type: boolean
        outcome:
          type: string
          enum: [answer, insufficient_evidence]
        abstentionReason:
          type: [string, 'null']
        provider:
          type: string
          enum: [mock, ollama]
        model:
          type: string
        embeddingModel:
          type: string
        promptVersion:
          type: string
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        embeddingTokens:
          type: integer
          minimum: 0
        tokenCountSource:
          type: string
          enum: [mock_estimate, provider_reported]
        estimatedCostUsd:
          type: number
          minimum: 0
        pricing:
          type: object
          additionalProperties: false
          required:
            [inputUsdPerMillion, outputUsdPerMillion, embeddingUsdPerMillion, effectiveDate, source]
          properties:
            inputUsdPerMillion:
              type: number
              minimum: 0
            outputUsdPerMillion:
              type: number
              minimum: 0
            embeddingUsdPerMillion:
              type: number
              minimum: 0
            effectiveDate:
              type: string
              format: date
            source:
              type: string
              enum: [mock, operator_configured]
        retrievalLatencyMs:
          type: number
          minimum: 0
        generationLatencyMs:
          type: number
          minimum: 0
        totalLatencyMs:
          type: number
          minimum: 0
        generatedAt:
          type: string
          format: date-time
        retrievalMode:
          type: string
          enum: [hybrid, hybrid_lexical_rerank]

    Draft:
      type: object
      additionalProperties: false
      required:
        - id
        - ticketId
        - text
        - status
        - revision
        - citations
        - evidenceValidated
        - model
        - promptVersion
        - reviewedBy
        - reviewedAt
        - reviewReason
        - createdAt
        - humanEdited
        - originalText
        - editedBy
        - editedAt
      properties:
        generation:
          anyOf:
            - $ref: '#/components/schemas/DraftGeneration'
            - type: 'null'
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 20000
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        revision:
          type: integer
          minimum: 1
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
          maxItems: 20
        evidenceValidated:
          type: boolean
        model:
          type: string
        promptVersion:
          type: string
        reviewedBy:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        reviewedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        reviewReason:
          anyOf:
            - type: string
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        humanEdited:
          type: boolean
        originalText:
          type:
            - string
            - 'null'
        editedBy:
          type:
            - string
            - 'null'
          format: uuid
        editedAt:
          type:
            - string
            - 'null'
          format: date-time
    ApproveDraftInput:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        acknowledgeEdits:
          type: boolean
          description: Required true when humanEdited; the reviewer accepts responsibility
            for edited wording.
    RejectDraftInput:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - reason
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
    WebhookTicketInput:
      type: object
      additionalProperties: false
      required:
        - eventId
        - ticket
      properties:
        eventId:
          type: string
          format: uuid
          description: UUID; case is normalized before event deduplication.
        ticket:
          $ref: '#/components/schemas/CreateTicketInput'
    EditDraftInput:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - text
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        text:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: \S
    CustomerMessageInput:
      type: object
      additionalProperties: false
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: \S
    ChangeTicketStatusInput:
      type: object
      additionalProperties: false
      required:
        - expectedStatus
        - event
      properties:
        expectedStatus:
          type: string
          enum:
            - open
            - pending
            - resolved
        event:
          type: string
          enum:
            - wait
            - resolve
            - reopen
    UploadedDocument:
      type: object
      additionalProperties: false
      required:
        - objectKey
        - sizeBytes
        - sha256
        - mediaType
      properties:
        objectKey:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^organizations/[0-9a-f-]{36}/uploads/[0-9a-f-]{36}$
          description: Existing staged object key. The organization namespace must match
            the authenticated identity; filenames, URLs and traversal segments are
            not accepted.
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        mediaType:
          type: string
          enum:
            - text/plain
            - text/markdown
            - application/pdf
  responses:
    Error:
      description:
        Standard error. GraphQL execution errors use the same code/message/requestId fields in
        extensions.
      headers:
        X-Request-ID:
          description: Correlation ID for this HTTP attempt; returned in canonical lowercase for a valid UUID.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    CapacityError:
      description: The durable ingestion backlog is full; retry after the indicated delay.
      headers:
        X-Request-ID:
          schema: { type: string, format: uuid }
        Retry-After:
          schema: { type: integer, minimum: 1 }
          description: Seconds to wait before submitting another request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
