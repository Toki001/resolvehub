query Tickets($first: Int = 20, $after: Cursor, $filter: TicketFilter) {
  tickets(first: $first, after: $after, filter: $filter) {
    edges {
      cursor
      node {
        id
        subject
        customerEmail
        status
        createdAt
        updatedAt
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query TicketDetails($id: ID!) {
  ticket(id: $id) {
    id
    subject
    customerEmail
    status
    createdAt
    updatedAt
    messages {
      id
      body
      author
      createdAt
    }
    drafts {
      id
      text
      status
      revision
      citations {
        documentId
        versionId
        chunkId
      }
    }
  }
}

query KnowledgeDocuments($first: Int = 20, $after: Cursor) {
  knowledgeDocuments(first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        title
        status
        activeVersionId
        createdAt
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query KnowledgeSearch($query: String!, $first: Int = 20, $after: Cursor) {
  knowledgeSearch(query: $query, first: $first, after: $after) {
    edges {
      cursor
      node {
        chunkId
        documentId
        versionId
        title
        excerpt
        createdAt
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query DraftResponse($id: ID!) {
  draft(id: $id) {
    id
    ticketId
    text
    status
    revision
    evidenceValidated
    humanEdited
    originalText
    editedBy
    editedAt
    model
    promptVersion
    generation {
      accountedAttempts
      usageIncomplete
      outcome
      abstentionReason
      provider
      model
      embeddingModel
      promptVersion
      inputTokens
      outputTokens
      embeddingTokens
      tokenCountSource
      estimatedCostUsd
      retrievalLatencyMs
      generationLatencyMs
      totalLatencyMs
      generatedAt
      retrievalMode
      pricing {
        inputUsdPerMillion
        outputUsdPerMillion
        embeddingUsdPerMillion
        effectiveDate
        source
      }
    }
    citations {
      documentId
      versionId
      chunkId
      quote
      reference
    }
    reviewedBy
    reviewedAt
    reviewReason
    createdAt
  }
}

query DashboardSummary {
  dashboardSummary {
    openTickets
    pendingTickets
    resolvedTickets
    publishedDocuments
    pendingReviews
    acceptedJobs
    failedJobs
  }
}

fragment ReviewDraft on DraftResponse {
  id
  ticketId
  text
  status
  revision
  evidenceValidated
  humanEdited
  originalText
  editedBy
  editedAt
  model
  promptVersion
  reviewedBy
  reviewedAt
  reviewReason
  createdAt
  citations {
    documentId
    versionId
    chunkId
    quote
    reference
  }
  generation {
    outcome
    abstentionReason
    inputTokens
    outputTokens
    estimatedCostUsd
    usageIncomplete
    provider
    totalLatencyMs
  }
}
query ReviewQueue($first: Int = 20, $after: Cursor, $status: DraftStatus = pending) {
  reviewQueue(first: $first, after: $after, status: $status) {
    edges {
      cursor
      node {
        ...ReviewDraft
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
query WorkspaceDraft($id: ID!) {
  draft(id: $id) {
    ...ReviewDraft
  }
}
query BackgroundJobs($first: Int = 20, $after: Cursor, $status: JobStatus) {
  backgroundJobs(first: $first, after: $after, status: $status) {
    edges {
      cursor
      node {
        id
        kind
        status
        resourceId
        attempts
        reasonCode
        createdAt
        updatedAt
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
query WorkspaceTicket($id: ID!, $messagesAfter: Cursor) {
  ticket(id: $id) {
    id
    subject
    customerEmail
    status
    createdAt
    updatedAt
    messageHistory(first: 50, after: $messagesAfter) {
      edges {
        cursor
        node {
          id
          body
          author
          deliveryStatus
          sourceDraftId
          createdAt
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    drafts {
      id
      text
      status
      revision
      humanEdited
      createdAt
    }
  }
}
