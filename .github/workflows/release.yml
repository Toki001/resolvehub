name: ResolveHub release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  authorize:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      prefix: ${{ steps.plan.outputs.prefix }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify protected main and tag ancestry; calculate immutable references
        id: plan
        run: pnpm exec tsx scripts/release-plan.ts
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [verify, authorize]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # Configure this environment to allow protected main and protected v* tags.
    environment: ghcr-production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [web, api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate only to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push one production component
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.component }}
          platforms: linux/amd64
          push: true
          provenance: mode=min
          tags: ${{ needs.authorize.outputs.prefix }}/${{ matrix.component }}:${{ needs.authorize.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.authorize.outputs.version }}
      - name: Record digest for explicit promotion and rollback
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ needs.authorize.outputs.prefix }}/${{ matrix.component }}
          TAG: ${{ needs.authorize.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: node scripts/write-release-manifest.mjs
      - name: Upload immutable deployment reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
