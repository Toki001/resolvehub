name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: cp .env.example .env
      - run: pnpm generate
      - name: Verify generated client has no drift
        run: git diff --exit-code -- packages/generated/src/rest.ts
      - run: pnpm check
      - run: pnpm build
      - run: pnpm infra:check
      - run: pnpm infra:up
      - name: Start compiled applications
        run: pnpm start > /tmp/resolvehub-start.log 2>&1 &
      - name: Wait for service readiness
        run: node scripts/wait-for-services.mjs
      - run: pnpm smoke
      - run: pnpm test:integration
      - name: Stop infrastructure
        if: always()
        run: docker compose down
