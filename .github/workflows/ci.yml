name: ResolveHub checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm env:setup
      - run: pnpm generate
      - name: Verify generated client has no drift
        run: node scripts/check-generated.mjs
      - run: pnpm check
      - run: pnpm build
      - run: pnpm infra:check
      - run: pnpm infra:up
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - name: Verify clean database bootstrap with synthetic fixtures
        run: pnpm db:bootstrap --database resolvehub_bootstrap_ci --seed
      - name: Start compiled applications
        run: pnpm start > /tmp/resolvehub-start.log 2>&1 &
      - name: Wait for service readiness
        run: node scripts/wait-for-services.mjs
      - run: pnpm smoke
      - name: Verify isolated integration tests and critical-service coverage
        run: pnpm test:coverage
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports
          path: |
            coverage/
            test-results/jest-results.json
            test-results/worker.log
            test-results/ai-evaluation.json
            test-results/ai-http-benchmark.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop infrastructure
        if: always()
        run: docker compose down
